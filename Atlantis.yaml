version: 3
projects:
  - name: "Atlantis"  # Replace with your actual project name
    dir: "."                    # Directory where your Terraform configuration is located
    terraform_version: "latest" # You can specify a specific version like "1.0.0" if needed
    workflow: "default"         # This specifies which workflow to use

workflows:
  default:
    plan:
      steps:
        - init
        - plan
    apply:
      steps:
        - apply
