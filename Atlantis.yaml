version: 3
projects:
  - name: "Atlantis"  # Replace with your actual project name
    dir: "Atlantis"    # Directory where your Terraform configuration is located
    terraform_version: "1.11.0"
    workflow: "default"  # Specifies which workflow to use

workflows:
  default:
    plan:
      steps:
        - init
        - plan
    apply:
      steps:
        - apply

server-side-config:
  allowed_overrides:
    - workflow
